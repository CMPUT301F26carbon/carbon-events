name: Unit tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and run unit tests
      run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:dokkaGenerateHtml --console=plain

    - run: python3 tools/check_test_results.py unit

    - name: Preserve unit results and API documentation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-tests-and-api
        path: |
          app/build/reports/tests/
          app/build/test-results/
          app/build/dokka/html/

