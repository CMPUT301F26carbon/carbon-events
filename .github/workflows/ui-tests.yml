name: UI tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: chmod +x gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.carbon.events.AppNavigationTest,com.carbon.events.OwnerCampsitesTest,com.carbon.events.OwnerLotteryTest,com.carbon.events.LotteryPeriodsTest,com.carbon.events.LotteryResultsTest,com.carbon.events.AdminProfilesTest --console=plain
      - run: python3 tools/check_test_results.py android
      - name: Preserve UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

